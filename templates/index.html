<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Pontos Turísticos</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <!-- CSS interno -->
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #f0f4f8, #d9eaf7);
      color: #333;
    }

    h1 {
      font-size: 2em;
      text-align: center;
      margin: 20px 0;
      color: #0077cc;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    .search-box {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    #endereco {
      flex: 1;
      min-width: 250px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-right: 10px;
    }

    #buscar {
      padding: 12px 20px;
      background-color: #0077cc;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    #buscar:hover {
      background-color: #005fa3;
    }

    #resultados {
      list-style: none;
      padding: 0;
      margin-top: 20px;
    }

    #resultados li {
      background-color: #fff;
      margin-bottom: 10px;
      padding: 12px;
      border-left: 4px solid #0077cc;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      border-radius: 6px;
      transition: transform 0.2s ease;
    }

    #resultados li:hover {
      transform: translateX(5px);
    }

    #map {
      height: 500px;
      width: 100%;
      margin-top: 20px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    #resultados li.ativo {
      background-color: #e6f2ff;
      border-left-color: #005fa3;
    }

    @media (max-width: 800px) {
      .search-box {
        flex-direction: column;
      }
      #endereco {
        margin-right: 0;
        margin-bottom: 10px;
      }
      #buscar {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Buscar Pontos Turísticos</h1>
    <div class="search-box">
      <input type="text" id="endereco" placeholder="Digite a cidade">
      <button id="buscar">Buscar</button>
    </div>

    <div id="map"></div>
    <ul id="resultados"></ul>
  </div>
</body>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="/static/js/script.js"></script>

</html>
