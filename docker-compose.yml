services:
  backend:
    build: .
    container_name: turismo_backend
    env_file:
      - .env
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:latest
    container_name: turismo_nginx
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./templates/index.html:/usr/share/nginx/html/index.html:ro
      - ./static:/usr/share/nginx/html/static
      - /dev/null:/etc/nginx/conf.d/default.conf
    depends_on:
      backend:
        condition: service_healthy   # 🔽 só sobe quando o backend estiver saudável
    restart: always
