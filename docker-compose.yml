version: "3.9"

services:
  backend:
    build: .
    container_name: turismo_backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    restart: always
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:latest
    container_name: turismo_nginx
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./templates/index.html:/usr/share/nginx/html/index.html:ro
      - ./static:/usr/share/nginx/html/static
      - /dev/null:/etc/nginx/conf.d/default.conf
    depends_on:
      backend:
        condition: service_healthy
    restart: always

  redis:
    image: redis:latest
    container_name: turismo_redis
    restart: always
    # ports:
    #   - "6380:6379"
